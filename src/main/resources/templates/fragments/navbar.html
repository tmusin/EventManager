<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-calendar-event me-1"></i>Event Manager
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <!-- Создать мероприятие -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/events/new}">
                        <i class="bi bi-plus-circle me-1"></i>Создать мероприятие
                    </a>
                </li>

                <!-- Менеджер -->
                <li class="nav-item" sec:authorize="hasAnyRole('MANAGER','ADMIN')">
                    <a class="nav-link" th:href="@{/manager}">
                        <i class="bi bi-clipboard-check me-1"></i>Модерация
                    </a>
                </li>

                <!-- Администратор -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-people me-1"></i>Пользователи
                    </a>
                </li>

                <!-- Профиль -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Профиль</span>
                    </a>
                </li>

                <!-- Выход -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Выйти
                        </button>
                    </form>
                </li>

                <!-- Войти -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                    </a>
                </li>
                <li class="nav-item ms-lg-1" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i>Регистрация
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</html>
