<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Главная')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <h1 class="mb-4 fw-bold">Ближайшие мероприятия</h1>

    <div th:if="${eventsPage.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-calendar-x display-4"></i>
        <p class="mt-3">Пока нет доступных мероприятий.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        <div class="col" th:each="event : ${eventsPage.content}">
            <div class="card h-100 shadow-sm">
                <img th:if="${event.coverImagePath != null}"
                     th:src="@{'/uploads/' + ${event.coverImagePath}}"
                     class="card-img-top object-fit-cover" style="height:200px;" alt="Обложка"/>
                <div th:unless="${event.coverImagePath != null}"
                     class="card-img-top bg-secondary d-flex align-items-center justify-content-center"
                     style="height:200px;">
                    <i class="bi bi-image text-white display-4"></i>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${event.title}">Название</h5>
                    <p class="card-text text-muted small">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy HH:mm')}">Дата</span>
                    </p>
                    <p class="card-text text-muted small">
                        <i class="bi bi-person me-1"></i>
                        <span th:text="${event.organizer.username}">Организатор</span>
                    </p>
                    <div class="d-flex justify-content-between align-items-center mt-auto pt-3">
                        <span th:if="${event.price.compareTo(T(java.math.BigDecimal).ZERO) == 0}"
                              class="badge bg-success fs-6">Бесплатно</span>
                        <span th:unless="${event.price.compareTo(T(java.math.BigDecimal).ZERO) == 0}"
                              class="badge bg-primary fs-6"
                              th:text="${event.price} + ' ₽'">Цена</span>
                        <span th:if="${event.maxParticipants == 0}"
                              class="text-muted small">
                            <i class="bi bi-infinity me-1"></i>Без ограничений
                        </span>
                        <span th:unless="${event.maxParticipants == 0}"
                              class="text-muted small">
                            <i class="bi bi-people me-1"></i>
                            <span th:text="${event.maxParticipants} + ' мест'">Мест</span>
                        </span>
                    </div>
                    <a th:href="@{/events/{id}(id=${event.id})}"
                       class="btn btn-outline-primary mt-3">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Пагинация -->
    <nav th:if="${eventsPage.totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage - 1})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, eventsPage.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item"
                th:classappend="${currentPage == eventsPage.totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/(page=${currentPage + 1})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
