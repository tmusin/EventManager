<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Пользователи')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <h2 class="mb-4"><i class="bi bi-people me-2"></i>Управление пользователями</h2>

  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Логин</th>
          <th>Роли</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td th:text="${user.id}">1</td>
          <td>
            <i class="bi bi-person-circle me-1 text-muted"></i>
            <span th:text="${user.username}">username</span>
          </td>
          <td>
            <form th:action="@{/admin/users/{id}/roles(id=${user.id})}"
                  method="post"
                  class="d-flex flex-wrap gap-2 align-items-center">
              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}"/>
              <div th:each="role : ${allRoles}"
                   class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="checkbox"
                       th:id="${'role_' + user.id + '_' + role.name()}"
                       name="roles"
                       th:value="${role.name()}"
                       th:checked="${user.roles.contains(role)}"/>
                <label class="form-check-label"
                       th:for="${'role_' + user.id + '_' + role.name()}"
                       th:text="${role.name()}">Роль</label>
              </div>
              <button type="submit" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-check-lg me-1"></i>Сохранить
              </button>
            </form>
          </td>
          <td>
            <span th:if="${user.enabled}" class="badge bg-success">
                <i class="bi bi-check-circle me-1"></i>Активен
            </span>
            <span th:unless="${user.enabled}" class="badge bg-danger">
                <i class="bi bi-slash-circle me-1"></i>Заблокирован
            </span>
          </td>
          <td>
            <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                  method="post">
              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}"/>
              <!-- Запрещаем администратору заблокировать самого себя -->
              <button type="submit"
                      th:disabled="${user.username == #authentication.name}"
                      th:class="${user.enabled}
                                        ? 'btn btn-outline-danger btn-sm'
                                        : 'btn btn-outline-success btn-sm'"
                      th:text="${user.enabled} ? 'Заблокировать' : 'Разблокировать'">
                Действие
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
