<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Модерация')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
  <h2 class="mb-4"><i class="bi bi-clipboard-check me-2"></i>Мероприятия на рассмотрении</h2>

  <div th:if="${#lists.isEmpty(events)}" class="alert alert-info">
    <i class="bi bi-info-circle me-2"></i>Нет мероприятий, ожидающих проверки.
  </div>

  <div class="row g-4">
    <div class="col-12" th:each="event : ${events}" th:id="'event-row-' + ${event.id}">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="row align-items-center">
            <div class="col-md-2">
              <img th:if="${event.coverImagePath != null}"
                   th:src="@{'/uploads/' + ${event.coverImagePath}}"
                   class="img-fluid rounded" alt="Обложка"/>
              <div th:unless="${event.coverImagePath != null}"
                   class="bg-secondary rounded d-flex align-items-center justify-content-center"
                   style="height:80px;">
                <i class="bi bi-image text-white fs-4"></i>
              </div>
            </div>
            <div class="col-md-7">
              <h5 class="mb-1">
                <a th:href="@{/events/{id}(id=${event.id})}"
                   target="_blank"
                   th:text="${event.title}">Название</a>
              </h5>
              <p class="text-muted small mb-1">
                <i class="bi bi-person me-1"></i>
                <span th:text="${event.organizer.username}">Организатор</span>
                &nbsp;|&nbsp;
                <i class="bi bi-calendar3 me-1"></i>
                <span th:text="${#temporals.format(event.eventDate, 'dd.MM.yyyy HH:mm')}">Дата</span>
              </p>
              <p class="mb-0 small text-truncate" th:text="${event.description}">Описание</p>
            </div>
            <div class="col-md-3 d-flex gap-2 justify-content-md-end mt-3 mt-md-0">
              <button class="btn btn-success"
                      th:data-event-id="${event.id}"
                      onclick="approveEvent(this)">
                <i class="bi bi-check-lg me-1"></i>Одобрить
              </button>
              <button class="btn btn-danger"
                      th:data-event-id="${event.id}"
                      onclick="rejectEvent(this)">
                <i class="bi bi-x-lg me-1"></i>Отклонить
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>

<div id="csrf"
     th:data-token="${_csrf.token}"
     th:data-header="${_csrf.headerName}"
     style="display:none"></div>

<script th:src="@{/js/manager.js}"></script>
</body>
</html>
