spring:
  application:
    name: EventManager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5462}/${DB_NAME:eventmanager}
    username: ${DB_USER:eventmanager}
    password: ${DB_PASSWORD:eventmanager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  thymeleaf:
    cache: false

server:
  port: 8080

app:
  upload:
    path: ${UPLOAD_PATH:/app/uploads}
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin}